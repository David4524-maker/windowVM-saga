<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>windowVM</title>
  <style>
    :root {
      --bg-main: #ffffff;
      --text-main: #000000;
      --text-muted: #b0b0b0;
      --accent-orange: #ff8c00;
      --accent-blue: #0ea5e9;
      --border: #e2e8f0;
      --bg-card: #f8fafc;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header & Logo --- */
    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 50px;
      height: 35px;
      border: 4px solid #000;
      border-radius: 4px;
      background: linear-gradient(to bottom, #93c5fd 75%, #0284c7 75%);
      position: relative;
    }
    
    .logo-icon::after {
      content: '●●';
      position: absolute;
      bottom: -2px;
      left: 2px;
      font-size: 10px;
      color: #000;
      letter-spacing: -2px;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .btn {
      background-color: var(--text-main);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background-color: #333; }
    .btn-danger { background-color: var(--danger) !important; color: #fff !important; }
    .btn-warning { background-color: var(--warning) !important; color: #000 !important; }

    /* --- Navegación (Pestañas) --- */
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-top: 1rem;
      border-bottom: 1px solid transparent;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 0.5rem 1rem;
      color: #000;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .tab-icon {
      font-size: 2rem;
    }

    .tab.active {
      border-bottom: 4px solid var(--accent-blue);
    }

    /* --- Contenido --- */
    main {
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 4rem;
    }

    /* --- Grid VMs --- */
    .vm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .vm-card {
      background: var(--bg-card);
      border: 2px solid #000;
      border-radius: 10px;
      padding: 1.2rem;
      position: relative;
      cursor: context-menu;
      user-select: none;
      transition: transform 0.2s;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }

    .vm-card:hover {
      transform: translateY(-3px);
    }

    .vm-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .vm-title { font-size: 1.1rem; font-weight: bold; }
    .badge-fav { color: #ffd700; font-size: 1.2rem; text-shadow: 1px 1px 0 #000; }
    .vm-info { font-size: 0.9rem; color: #333; display: flex; flex-direction: column; gap: 0.4rem; }

    /* --- Menú Contextual --- */
    .context-menu {
      position: fixed;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      display: none;
      z-index: 1000;
      min-width: 180px;
      overflow: hidden;
    }

    .context-menu-item {
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #000;
      transition: background 0.15s;
    }

    .context-menu-item:hover { background-color: #f1f5f9; }
    .context-menu-item.delete { color: var(--danger); font-weight: bold; }
    .context-menu-item.delete:hover { background-color: #fee2e2; }

    /* --- Modal y Pantalla VM --- */
    .modal-overlay, .vm-screen-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      z-index: 900;
    }

    .modal-overlay { justify-content: center; align-items: center; }
    
    .modal {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      border: 2px solid #000;
    }

    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group input, .form-group select { padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem; }

    .vm-screen-overlay { flex-direction: column; z-index: 2000; background: #000; }
    .vm-topbar { background: #111; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .vm-viewport { flex: 1; display: flex; justify-content: center; align-items: center; background: #222; }
    .vm-desktop { width: 90%; height: 80%; background: #1e1e2e; border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; color: #fff; }
    .vm-os-screen { flex: 1; background: #000; color: #0f0; font-family: monospace; padding: 1rem; overflow-y: auto; }
    .installed-files { margin-top: 1rem; background: #333; padding: 0.6rem; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon"></div>
      <div class="logo-text">windowVM</div>
    </div>
    <button class="btn" id="btnOpenNewVm">+ Nueva VM</button>
  </header>

  <nav class="tabs-container">
    <div class="tab active" data-target="tab-mis-vms">
      <div class="tab-icon">🖥️</div>
      <div>Mis maquinas virtuales</div>
    </div>
    <div class="tab" data-target="tab-favoritos">
      <div class="tab-icon">⭐</div>
      <div>Favoritos</div>
    </div>
  </nav>

  <main>
    <!-- Seccion Mis Maquinas Virtuales -->
    <section id="tab-mis-vms" class="tab-content active">
      <div class="vm-grid" id="allVmsGrid"></div>
      <div id="allVmsEmpty"></div>
    </section>

    <!-- Seccion Favoritos -->
    <section id="tab-favoritos" class="tab-content">
      <div class="vm-grid" id="favoritesGrid"></div>
      <div id="favoritesEmpty"></div>
    </section>
  </main>

  <!-- Menú Contextual -->
  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxStart">▶ Iniciar VM</div>
    <div class="context-menu-item" id="ctxFav">⭐ Guardar a favoritos</div>
    <div class="context-menu-item delete" id="ctxDelete">🗑️ ELIMINAR VM</div>
  </div>

  <!-- Modal Crear Nueva VM -->
  <div class="modal-overlay" id="newVmModal">
    <div class="modal">
      <h3>Crear Nueva VM</h3>
      <form id="newVmForm">
        <div class="form-group"><label>Nombre</label><input type="text" id="vmName" required></div>
        <div class="form-group"><label>RAM (GB)</label><input type="number" id="vmRam" min="1" value="4" required></div>
        <div class="form-group"><label>Núcleos</label><input type="number" id="vmCores" min="1" value="2" required></div>
        <div class="form-group"><label>Archivo ISO (Bloquea SO)</label><input type="file" id="vmIso" accept=".iso"></div>
        <div class="form-group">
          <label>Sistema Operativo</label>
          <select id="vmOs">
            <option>Windows 11</option><option>Windows 10</option><option>Ubuntu</option>
          </select>
        </div>
        <div class="form-group" style="flex-direction:row; align-items:center;">
          <input type="checkbox" id="vmSpecial"> <label>Acciones Especiales (SSD + Drag&Drop)</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="btnCloseModal">Cancelar</button>
          <button type="submit" class="btn">Crear</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Pantalla VM -->
  <div class="vm-screen-overlay" id="vmRunnerScreen">
    <div class="vm-topbar">
      <div id="activeVmTitle">Ejecutando VM</div>
      <div style="display:flex; gap: 0.5rem;">
        <button class="btn btn-warning" id="btnPauseVm">Pausar</button>
        <button class="btn" id="btnRestartVm">Reiniciar</button>
        <button class="btn btn-danger" id="btnResetVm">Resetear</button>
        <button class="btn" id="btnCloseVmScreen" style="background:#555;">Salir</button>
      </div>
    </div>
    <div class="vm-viewport" id="vmViewport">
      <div class="vm-desktop">
        <div class="vm-os-screen" id="vmLogScreen"></div>
        <div class="installed-files">
          <strong>📦 Archivos instalados:</strong>
          <ul id="installedFilesList" style="list-style:none; padding-top:0.5rem; font-size:0.9rem;"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- ESTADO & LOCALSTORAGE ---
    let vms = JSON.parse(localStorage.getItem('windowVM_data')) || [];
    let selectedVmId = null;
    let runningVm = null;

    // --- PESTAÑAS ---
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    // --- DOM ---
    const allVmsGrid = document.getElementById('allVmsGrid');
    const favoritesGrid = document.getElementById('favoritesGrid');
    const allVmsEmpty = document.getElementById('allVmsEmpty');
    const favoritesEmpty = document.getElementById('favoritesEmpty');
    const vmOsSelect = document.getElementById('vmOs');
    const vmIsoInput = document.getElementById('vmIso');

    // Bloqueo ISO
    vmIsoInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        vmOsSelect.disabled = true;
        let opt = document.getElementById('isoTemp');
        if(!opt) { opt = document.createElement('option'); opt.id = 'isoTemp'; vmOsSelect.appendChild(opt); }
        opt.value = opt.textContent = `ISO: ${e.target.files[0].name}`;
        vmOsSelect.value = opt.value;
      } else {
        vmOsSelect.disabled = false;
        if(document.getElementById('isoTemp')) document.getElementById('isoTemp').remove();
      }
    });

    function renderVMs() {
      allVmsGrid.innerHTML = '';
      favoritesGrid.innerHTML = '';
      const favs = vms.filter(v => v.favorite);

      // Estado Vacío: "No hay VMs" (gris, centrado)
      allVmsEmpty.innerHTML = vms.length === 0 ? '<div class="empty-msg">No hay VMs</div>' : '';
      favoritesEmpty.innerHTML = favs.length === 0 ? '<div class="empty-msg">No hay VMs</div>' : '';

      vms.forEach(vm => allVmsGrid.appendChild(createVmCard(vm)));
      favs.forEach(vm => favoritesGrid.appendChild(createVmCard(vm)));
    }

    function createVmCard(vm) {
      const card = document.createElement('div');
      card.className = 'vm-card';
      card.innerHTML = `
        <div class="vm-card-header">
          <div class="vm-title">${vm.name}</div>
          ${vm.favorite ? '<span class="badge-fav">⭐</span>' : ''}
        </div>
        <div class="vm-info">
          <div>💿 ${vm.os}</div>
          <div>🧠 ${vm.ram} GB | ⚡ ${vm.cores} Cores</div>
        </div>
      `;
      card.oncontextmenu = (e) => { e.preventDefault(); selectedVmId = vm.id; showContextMenu(e.clientX, e.clientY, vm); };
      card.ondblclick = () => startVm(vm.id);
      return card;
    }

    // --- MENÚ CONTEXTUAL ---
    const ctx = document.getElementById('contextMenu');
    function showContextMenu(x, y, vm) {
      ctx.style.left = `${x}px`; ctx.style.top = `${y}px`; ctx.style.display = 'block';
      document.getElementById('ctxFav').textContent = vm.favorite ? '❌ Quitar de favoritos' : '⭐ Guardar a favoritos';
    }
    document.addEventListener('click', () => ctx.style.display = 'none');
    
    document.getElementById('ctxStart').onclick = () => startVm(selectedVmId);
    document.getElementById('ctxFav').onclick = () => {
      let vm = vms.find(v => v.id === selectedVmId);
      if(vm) { vm.favorite = !vm.favorite; save(); }
    };
    document.getElementById('ctxDelete').onclick = () => {
      vms = vms.filter(v => v.id !== selectedVmId); save();
    };

    function save() { localStorage.setItem('windowVM_data', JSON.stringify(vms)); renderVMs(); }

    // --- MODAL ---
    document.getElementById('btnOpenNewVm').onclick = () => document.getElementById('newVmModal').style.display = 'flex';
    document.getElementById('btnCloseModal').onclick = () => document.getElementById('newVmModal').style.display = 'none';
    
    document.getElementById('newVmForm').onsubmit = (e) => {
      e.preventDefault();
      vms.push({
        id: Date.now().toString(), name: document.getElementById('vmName').value,
        ram: document.getElementById('vmRam').value, cores: document.getElementById('vmCores').value,
        os: vmOsSelect.value, specialActions: document.getElementById('vmSpecial').checked,
        favorite: false, installedFiles: []
      });
      save(); e.target.reset(); vmOsSelect.disabled = false;
      document.getElementById('newVmModal').style.display = 'none';
    };

    // --- EJECUCIÓN VM ---
    function startVm(id) {
      runningVm = vms.find(v => v.id === id);
      if(!runningVm) return;
      document.getElementById('vmRunnerScreen').style.display = 'flex';
      document.getElementById('activeVmTitle').textContent = `Ejecutando: ${runningVm.name}`;
      document.getElementById('vmLogScreen').innerHTML = `<div>[SYS] Arrancando ${runningVm.os}...</div>`;
      if(runningVm.specialActions) document.getElementById('vmLogScreen').innerHTML += `<div>[SSD] Optimización activada.</div>`;
      renderFiles(); setupDragDrop();
    }

    function renderFiles() {
      const list = document.getElementById('installedFilesList');
      list.innerHTML = runningVm.installedFiles.length ? '' : '<li>Arrastra archivos aquí...</li>';
      runningVm.installedFiles.forEach(f => list.innerHTML += `<li>✔️ ${f}</li>`);
    }

    document.getElementById('btnPauseVm').onclick = function() {
      this.textContent = this.textContent === 'Pausar' ? 'Reanudar' : 'Pausar';
    };
    document.getElementById('btnRestartVm').onclick = () => document.getElementById('vmLogScreen').innerHTML += `<div>[SYS] Reiniciando...</div>`;
    document.getElementById('btnResetVm').onclick = () => {
      if(confirm('¿Borrar datos internos?')) { runningVm.installedFiles = []; save(); renderFiles(); }
    };
    document.getElementById('btnCloseVmScreen').onclick = () => document.getElementById('vmRunnerScreen').style.display = 'none';

    function setupDragDrop() {
      const vp = document.getElementById('vmViewport');
      vp.ondragover = e => e.preventDefault();
      vp.ondrop = e => {
        e.preventDefault();
        if(runningVm && runningVm.specialActions && e.dataTransfer.files.length) {
          Array.from(e.dataTransfer.files).forEach(f => runningVm.installedFiles.push(f.name));
          save(); renderFiles();
        }
      };
    }

    renderVMs();
  </script>
</body>
</html>
